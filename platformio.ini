; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = motor_test

; Shared settings for all test environments
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

lib_deps =
    willguimont/CanControl@^1.2.1

[env:motor_test]
build_src_filter =
    +<motor_run_test.cpp>

[env:actuation_test]
build_src_filter =
    +<actuation_test.cpp>

[env:pt_test]
build_src_filter =
    +<pt_test.cpp>

[env:dwell]
build_src_filter =
    +<dwell_test.cpp>

[env:dwell_csv]
monitor_speed = 57200
build_src_filter =
    +<dwell_csv_test.cpp>

[env:dwell_soak]
monitor_speed = 57600
build_src_filter =
    +<dwell_soak_test.cpp>


